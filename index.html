<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyncGrades (Demo)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>SyncGrades</h1>
  <span class="demo">Demo project · sample data</span>
</header>
<main>
  <section class="key" aria-label="Grade key">
    <span><b class="badge E">E</b> Excellent, 90% and up</span>
    <span><b class="badge G">G</b> Good, 80–89%</span>
    <span><b class="badge S">S</b> Satisfactory, 70–79%</span>
    <span><b class="badge N">N</b> Needs improvement, below 70%</span>
  </section>
  <p class="hint">Tap a percentage to edit it. The letter updates automatically.</p>
  <ul id="classes" class="classes"></ul>
</main>
<script src="script.js"></script>
</body>
</html>
